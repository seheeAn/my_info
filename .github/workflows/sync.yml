name: 글 동기화 및 카테고리 분류

on:
  # 매일 KST 03:00 자동 실행 (UTC 18:00)
  schedule:
    - cron: '0 18 * * *'
  # 수동 실행 (GitHub Actions 탭에서 직접 트리거 가능)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: Node.js 버전 확인
        run: node --version

      - name: 글 동기화 + 카테고리 분류 실행
        # NODE_OPTIONS --require로 tsx 실행 전에 WebSocket 폴리필 먼저 로드
        run: NODE_OPTIONS="--require ./src/scripts/polyfill.cjs" npx tsx src/scripts/sync.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_VELOG_USERNAME: ${{ secrets.VELOG_USERNAME }}
          NEXT_PUBLIC_TISTORY_BLOG_NAME: ${{ secrets.TISTORY_BLOG_NAME }}
